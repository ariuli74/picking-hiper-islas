<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picking Hiper - Tema Oscuro</title>
  <style>
    :root {
      /* Colores Tema Oscuro Nocturno / Mañanero */
      --bg-color: #0b0f19;         /* Fondo súper oscuro para no encandilar */
      --card-bg: #161e2e;        /* Tarjetas en tono azul/gris oscuro con buen contraste */
      --card-border: #273549;
      --frente-color: #10b981;     /* Verde esmeralda suave pero legible */
      --dorso-color: #f59e0b;      /* Ámbar / Naranja cálido */
      --puntera-color: #3b82f6;    /* Azul suave */
      --text-main: #e2e8f0;       /* Blanco apagado / suave para que no queme los ojos */
      --text-sub: #94a3b8;
      --accent: #38bdf8;          /* Azul celeste para resaltar */
      --input-bg: #111827;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background: var(--bg-color); 
      color: var(--text-main); 
      padding: 12px; 
      padding-bottom: 80px; 
    }
    
    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.2rem; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    .search-box { position: sticky; top: 10px; z-index: 100; margin-bottom: 15px; }
    .search-box input {
      width: 100%; 
      padding: 12px 16px; 
      border-radius: 12px; 
      border: 1.5px solid #334155;
      background: var(--input-bg); 
      color: #f8fafc; 
      font-size: 1rem; 
      outline: none; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
    }

    .section-title {
      font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
      color: var(--accent); margin: 16px 0 8px 0; border-bottom: 1px solid #1e293b; padding-bottom: 6px;
    }

    /* Layout en Arco / U */
    .layout-grid { display: flex; flex-direction: column; gap: 15px; }
    .pasillo-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    
    /* Layout para Pasillo Derecho + Punteras */
    .pasillo-derecho-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .card {
      background: var(--card-bg); 
      border-radius: 10px; 
      padding: 10px; 
      border: 1px solid var(--card-border); 
      position: relative;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card-title { font-size: 0.8rem; font-weight: bold; color: var(--text-sub); }
    .btn-edit { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.95rem; opacity: 0.8; }
    .btn-edit:active { opacity: 1; }

    .faces { display: flex; flex-direction: column; gap: 6px; }
    .face {
      padding: 8px 10px; 
      border-radius: 6px; 
      font-size: 0.85rem; 
      font-weight: 600;
      line-height: 1.3;
    }
    
    /* Tonos oscuros con bordes brillantes */
    .face-frente { 
      background: rgba(16, 185, 129, 0.12); 
      border-left: 3px solid var(--frente-color); 
      color: #34d399; 
    }
    .face-dorso { 
      background: rgba(245, 158, 11, 0.12); 
      border-left: 3px solid var(--dorso-color); 
      color: #fbbf24; 
    }
    .face-puntera { 
      background: rgba(59, 130, 246, 0.12); 
      border-left: 3px solid var(--puntera-color); 
      color: #60a5fa; 
    }

    /* Resaltado de búsqueda en modo oscuro */
    .highlight { 
      border: 2px solid #f43f5e !important; 
      background: rgba(244, 63, 94, 0.25) !important;
      color: #fff !important;
      animation: pulse 1s infinite alternate; 
    }
    @keyframes pulse { from { opacity: 0.8; } to { opacity: 1; } }

    .add-btn {
      width: 100%; padding: 10px; background: #131b2e; border: 1px dashed #334155;
      color: var(--accent); border-radius: 8px; font-weight: bold; margin-top: 8px; cursor: pointer;
      font-size: 0.85rem;
    }
    .add-btn:active { background: #1e293b; }
  </style>
</head>
<body>

  <header>
    <h1>🌙 MAPA DE PICKING</h1>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Buscar producto (ej. Aceite, Galletitas)..." oninput="buscarProducto()">
  </div>

  <div class="layout-grid">
    <!-- PASILLO FONDO (TRANSVERSAL) -->
    <div>
      <div class="section-title">⚽ Fondo (Pasillo Transversal)</div>
      <div class="pasillo-container" id="islasFondo"></div>
      <button class="add-btn" onclick="agregarItem('fondo', 'Isla')">+ Agregar Isla al Fondo</button>
    </div>

    <!-- PASILLO IZQUIERDO -->
    <div>
      <div class="section-title">⬅️ Pasillo Izquierdo</div>
      <div class="pasillo-container" id="islasIzquierda"></div>
      <button class="add-btn" onclick="agregarItem('izquierda', 'Isla')">+ Agregar Isla Izquierda</button>
    </div>

    <!-- PASILLO DERECHO + PUNTERAS DERECHAS -->
    <div>
      <div class="section-title">➡️ Pasillo Derecho & Punteras</div>
      <div class="pasillo-derecho-wrapper">
        <div>
          <div style="font-size:0.75rem; color:#94a3b8; text-align:center; margin-bottom:6px; font-weight:bold;">ISLAS</div>
          <div class="pasillo-container" id="islasDerecha" style="grid-template-columns: 1fr;"></div>
          <button class="add-btn" onclick="agregarItem('derecha', 'Isla')">+ Isla</button>
        </div>
        <div>
          <div style="font-size:0.75rem; color:#60a5fa; text-align:center; margin-bottom:6px; font-weight:bold;">PUNTERAS</div>
          <div class="pasillo-container" id="punterasDerecha" style="grid-template-columns: 1fr;"></div>
          <button class="add-btn" style="border-color:#2563eb; color:#60a5fa;" onclick="agregarItem('punterasDerecha', 'Puntera')">+ Puntera</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Datos iniciales
    let datos = JSON.parse(localStorage.getItem('picking_datos')) || {
      fondo: [
        { id: 1, nombre: "Isla F1", frente: "Galletitas Dulces", dorso: "Mermeladas" }
      ],
      izquierda: [
        { id: 2, nombre: "Isla I1", frente: "Aceite de Girasol", dorso: "Fideos Mostachol" }
      ],
      derecha: [
        { id: 3, nombre: "Isla D1", frente: "Arroz Largo Fino", dorso: "Puré de Tomate" }
      ],
      punterasDerecha: [
        { id: 4, nombre: "Puntera D1", frente: "Oferta Snacks", dorso: "Gaseosas 2.25L" }
      ]
    };

    function guardar() {
      localStorage.setItem('picking_datos', JSON.stringify(datos));
      render();
    }

    function render() {
      renderSeccion('islasFondo', datos.fondo);
      renderSeccion('islasIzquierda', datos.izquierda);
      renderSeccion('islasDerecha', datos.derecha);
      renderSeccion('punterasDerecha', datos.punterasDerecha, true);
    }

    function renderSeccion(elementId, items, esPuntera = false) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';
      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${item.nombre}</span>
            <button class="btn-edit" onclick="editarItem('${elementId}', ${index})">✏️</button>
          </div>
          <div class="faces">
            <div class="face ${esPuntera ? 'face-puntera' : 'face-frente'}" data-txt="${item.frente}">
              ${esPuntera ? 'Frente' : 'Frente'}: ${item.frente || 'Vacío'}
            </div>
            <div class="face ${esPuntera ? 'face-puntera' : 'face-dorso'}" data-txt="${item.dorso}">
              ${esPuntera ? 'Lado' : 'Dorso'}: ${item.dorso || 'Vacío'}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function editarItem(seccionId, index) {
      let clave = seccionId.replace('islas', '').toLowerCase();
      if (seccionId === 'punterasDerecha') clave = 'punterasDerecha';
      else if (clave === 'fondo') clave = 'fondo';
      else if (clave === 'izquierda') clave = 'izquierda';
      else if (clave === 'derecha') clave = 'derecha';

      const item = datos[clave][index];
      const nuevoFrente = prompt(`Producto del FRENTE en ${item.nombre}:`, item.frente);
      if (nuevoFrente === null) return;
      const nuevoDorso = prompt(`Producto del DORSO/LADO en ${item.nombre}:`, item.dorso);
      if (nuevoDorso === null) return;

      datos[clave][index].frente = nuevoFrente;
      datos[clave][index].dorso = nuevoDorso;
      guardar();
    }

    function agregarItem(clave, prefijo) {
      const num = datos[clave].length + 1;
      datos[clave].push({
        id: Date.now(),
        nombre: `${prefijo} ${num}`,
        frente: "Producto Frente",
        dorso: "Producto Dorso"
      });
      guardar();
    }

    function buscarProducto() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const faces = document.querySelectorAll('.face');
      
      faces.forEach(face => {
        const txt = face.getAttribute('data-txt').toLowerCase();
        if (query !== '' && txt.includes(query)) {
          face.classList.add('highlight');
        } else {
          face.classList.remove('highlight');
        }
      });
    }

    render();
  </script>
</body>
</html>
